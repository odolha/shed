name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Libraries GPUI builds against, and zsh for its tests
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libxcb1-dev libfontconfig-dev zsh
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - name: shed without windows (CLI and shed tui)
        run: |
          cargo clippy --locked -p shed-app --no-default-features --features tui --all-targets -- -D warnings
          cargo build --locked -p shed-app --no-default-features --features tui
          if cargo tree --locked -p shed-app --no-default-features --features tui -e normal,build | grep -iE "gpui|x11|wayland"; then
            echo "the build without windows pulls in display libraries"; exit 1
          fi

  # The web app, and the nexus built with it (the Rust jobs above build in
  # debug, which leaves the web app out of shed-nexus).
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build and test the web app
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npm test
          npm run check:mock
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: The nexus with the web app built in
        run: SHED_NEXUS_WEB=1 cargo test --locked -p shed-nexus

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: bash 5 for the shell-integration tests (macOS's own is 3.2)
        run: brew install bash
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - name: Shed.app
        run: packaging/macos/bundle.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Shed-macos-arm64
          path: target/macos/*.zip
