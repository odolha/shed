name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Libraries GPUI builds against, and zsh for its tests
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libxcb1-dev libfontconfig-dev zsh
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --workspace

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: bash 5 for the shell-integration tests (macOS's own is 3.2)
        run: brew install bash
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - name: Shed.app
        run: packaging/macos/bundle.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Shed-macos-arm64
          path: target/macos/*.zip
