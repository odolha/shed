# The Shed nexus's settings (`shed-nexus --config <this file>`). Every setting
# is optional; the values shown are the defaults unless marked "example".
# See docs/nexus-deploy.md.

# Where to listen. Behind a reverse proxy, keep it on loopback.
listen = "127.0.0.1:7870"

# The address people and workspaces reach the nexus at (example). Used for the
# setup link, the allowed WebSocket origin and the push contact.
public_url = "https://nexus.example.com"

# The database and the push key. Default: $XDG_DATA_HOME/shed-nexus.
data_dir = "/var/lib/shed-nexus"

# Serve the web app from this folder (a build of web/) instead of the one
# built into shed-nexus (example).
# web_dir = "/usr/local/share/shed-nexus/web"

# How long a browser stays signed in.
session_days = 7

# How long Shed's desktop app stays signed in (it may reach workspaces'
# keepers); signing in again, with a code from the authenticator, renews it.
desktop_days = 30

# Behind a reverse proxy that sets X-Forwarded-For (nginx, see
# docs/nexus-deploy.md): believe that header from the proxies below, and take
# the client to be the right-most address in it that is not one of them.
# Only with a proxy you run in front.
trusted_proxy = true
# The proxies' addresses. Default (empty): loopback, for a proxy on this host.
# trusted_proxies = ["127.0.0.1/32", "::1/128"]

# Session cookies only over HTTPS. Turn off only for a plain-HTTP test nexus
# not on localhost.
secure_cookies = true

# Pages that may open /api with a session cookie. Default: the public URL's.
# allowed_origins = ["https://nexus.example.com"]

# Only these address ranges may reach the nexus at all (example). Default: any.
# allowed_networks = ["192.0.2.0/24", "2001:db8::/32"]

# How long a workspace has to answer a request, in seconds.
request_timeout_secs = 60

# Sent with every answer. The default allows the nexus's own files only.
# content_security_policy = "default-src 'self'; …"

# Connections open at once; more wait until one closes.
max_connections = 1024
# Seconds a client has to send a request's headers (and that an idle
# connection is kept between requests).
header_timeout_secs = 10

[geo]
# A GeoIP CSV of address ranges: `start,end,country` per line (db-ip's
# "IP to Country Lite", IP2Location LITE DB1). Also shows where devices sign
# in from (example).
# database = "/var/lib/shed-nexus/dbip-country-lite.csv"
# Two-letter country codes allowed in (example). Empty: no filter.
# countries = ["DE", "FR"]
# Let in addresses the database does not know. Private and loopback
# addresses always come in.
allow_unknown = false

[login]
# An "address" here is an IPv4 address or an IPv6 /64.
# Failed sign-ins from one address before it is locked out; also wrong
# one-time codes per signed-in device (revoking, pairing, the password).
max_failures = 5
# How long failures count, and a lockout lasts.
lockout_minutes = 15
# Failed sign-ins from everywhere, within lockout_minutes, before the nexus
# slows down: addresses that never signed in then share slow_per_minute
# attempts; addresses that signed in before are not held back.
global_max_failures = 50
slow_per_minute = 6
# Pairing requests per address per minute.
pair_per_minute = 5

[push]
# Notifications when no Shed app is in view (while one is, the apps get them
# live and nothing is pushed): Web Push to browsers, and to phones a ntfy
# topic (ntfy_url) or, without one, UnifiedPush. Off: nothing is pushed.
enabled = true
# A ntfy topic for phones, on a ntfy you run (example; see
# docs/nexus-deploy.md §7). SHED_NEXUS_NTFY_URL wins over it; the publishing
# token: SHED_NEXUS_NTFY_TOKEN in /etc/shed-nexus.env, never here. Carries the
# kinds any phone wants. Leave out for UnifiedPush to phones instead.
# ntfy_url = "https://ntfy.example.com/alerts-shed"
# Seconds a workspace stays offline before that is notified.
offline_after_secs = 120
# Who push services can contact: mailto: or https:. Default: the public URL.
# subject = "mailto:admin@example.com"
# Accept http: push endpoints (a ntfy on a private network only).
allow_http_endpoints = false
# Accept push endpoints on private, loopback or link-local addresses (a ntfy
# on a private network, for UnifiedPush). Off: public addresses only.
allow_private_endpoints = false
