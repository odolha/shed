[workspace]
resolver = "3"
members = ["crates/*"]
# A plain `cargo build` (and `cargo build --release`) makes the desktop app and
# its keeper; the nexus is built on its own (`-p shed-nexus`, `cargo install`):
# its release build embeds the web app, which needs Node. `--workspace` takes
# every crate (CI's clippy and tests do).
default-members = [
    "crates/shed-ai", "crates/shed-api", "crates/shed-app", "crates/shed-client", "crates/shed-codegen",
    "crates/shed-desktop", "crates/shed-emu", "crates/shed-git", "crates/shed-keeper", "crates/shed-link",
    "crates/shed-logbook", "crates/shed-markdown", "crates/shed-model", "crates/shed-project", "crates/shed-proto", "crates/shed-review",
    "crates/shed-save", "crates/shed-text", "crates/shed-tui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/odolha/shed"
rust-version = "1.95"

[workspace.dependencies]
shed-model = { path = "crates/shed-model" }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
shed-proto = { path = "crates/shed-proto" }
shed-emu = { path = "crates/shed-emu" }
shed-keeper = { path = "crates/shed-keeper" }
shed-logbook = { path = "crates/shed-logbook" }
shed-save = { path = "crates/shed-save" }
shed-desktop = { path = "crates/shed-desktop" }
shed-text = { path = "crates/shed-text" }
shed-project = { path = "crates/shed-project" }
shed-ai = { path = "crates/shed-ai" }
shed-markdown = { path = "crates/shed-markdown" }
shed-git = { path = "crates/shed-git" }
shed-tui = { path = "crates/shed-tui" }
shed-review = { path = "crates/shed-review" }
shed-api = { path = "crates/shed-api" }
shed-client = { path = "crates/shed-client" }
shed-link = { path = "crates/shed-link" }

# GPUI community edition, pinned exactly: upgrade on purpose, one version at a time.
gpui = { package = "gpui-ce", version = "=0.3.0" }
gpui_platform = { package = "gpui_ce_platform", version = "=0.3.0", features = ["x11", "wayland"] }
alacritty_terminal = "0.26.0"
# The terminal interface (`shed tui`): ratatui with its crossterm backend (re-exported as `ratatui::crossterm`).
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "underline-color", "layout-cache"] }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["use-std"] }
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "io-util", "io-std", "sync", "time", "macros", "signal", "process"] }
nix = { version = "0.31", features = ["term", "process", "signal", "fs", "ioctl", "user", "hostname"] }
libc = "0.2"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-channel = "2"
insta = "1"
tempfile = "3"
toml = "1"
toml_edit = "0.25"
rusqlite = { version = "0.41", features = ["bundled"] }
base64 = "0.22"
zstd = "0.13"
ropey = "1"
similar = "2"
unicode-width = "0.2"
ignore = "0.4"
grep-searcher = "0.1"
grep-regex = "0.1"
grep-matcher = "0.1"
regex = "1"
serde_json = "1"
typeshare = "1"

# The nexus (shed-nexus).
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["set-header", "limit"] }
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server-auto", "tokio", "service"] }
tower-service = "0.3"
argon2 = "0.5"
totp-rs = { version = "5", features = ["otpauth", "gen_secret"] }
rand = "0.9"
sha2 = "0.10"
subtle = "2"
ipnet = "2"
web-push-native = "0.5"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-tungstenite = "0.29"
# The link (shed-link): the web's roots, plus a CA file of one's own if set.
rustls-pki-types = { version = "1", features = ["std"] }
webpki-roots = "1"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
notify = "8"
nucleo-matcher = "0.3"
tree-sitter = "0.27"
tree-sitter-highlight = "0.27"
tree-sitter-bash = "0.25"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-css = "0.25"
tree-sitter-go = "0.25"
tree-sitter-html = "0.23"
tree-sitter-java = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-json = "0.24"
tree-sitter-kotlin-ng = "1.1"
tree-sitter-md = "0.5"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-toml-ng = "0.7"
tree-sitter-typescript = "0.23"
tree-sitter-xml = "0.7"
tree-sitter-yaml = "0.7"

# A vendored copy with read-only accessors for screen replay; see vendor/alacritty_terminal/SHED_PATCHES.md.
[patch.crates-io]
alacritty_terminal = { path = "vendor/alacritty_terminal" }
# Window-sized backgrounds drawn as the clear colour; see vendor/gpui_ce_wgpu/SHED_PATCHES.md.
gpui_ce_wgpu = { path = "vendor/gpui_ce_wgpu" }
# Quads drawn only inside their clip; see vendor/gpui_ce_render/SHED_PATCHES.md.
gpui_ce_render = { path = "vendor/gpui_ce_render" }
# X11 key releases no longer lost when two arrive together; see vendor/gpui_ce_linux/SHED_PATCHES.md.
gpui_ce_linux = { path = "vendor/gpui_ce_linux" }

[profile.dev.package."*"]
opt-level = 2

[profile.release]
# What `cargo install` and the packages build: symbols stay, for backtraces,
# but no debug info, which made the binaries several times larger.
strip = "debuginfo"

# For profiling: `cargo build --profile profiling`.
[profile.profiling]
inherits = "release"
debug = "line-tables-only"
strip = "none"
