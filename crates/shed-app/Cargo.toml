[package]
name = "shed-app"
version.workspace = true
repository.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "shed"
path = "src/main.rs"

[dependencies]
shed-model.workspace = true
shed-proto.workspace = true
shed-emu.workspace = true
shed-desktop.workspace = true
shed-logbook.workspace = true
shed-save.workspace = true
shed-text.workspace = true
shed-project.workspace = true
shed-ai.workspace = true
shed-git.workspace = true
serde_json.workspace = true
base64.workspace = true
# Must match the version gpui-ce uses, for window icons.
image = { version = "0.25", default-features = false }
gpui.workspace = true
gpui_platform.workspace = true
anyhow.workspace = true
serde.workspace = true
toml.workspace = true
clap.workspace = true
libc.workspace = true
async-channel.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

raw-window-handle = "0.6"

# Changing an open window's icon on X11, which GPUI only sets at opening, and
# hearing which selection changed last (XFixes), for middle-click.
[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["xfixes"] }

[dev-dependencies]
shed-keeper.workspace = true
tokio.workspace = true
tempfile.workspace = true
