[package]
name = "shed-app"
version.workspace = true
repository.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "shed"
path = "src/main.rs"

[features]
default = ["gui", "tui"]
# The windows (GPUI). Without it, `shed` is the CLI and the terminal
# interface: a server build, with no display libraries.
gui = ["dep:gpui", "dep:gpui_platform", "dep:image", "dep:raw-window-handle", "dep:x11rb", "shed-markdown/render"]
# `shed tui`, Shed in a terminal (ratatui).
tui = ["dep:shed-tui"]

[dependencies]
shed-model.workspace = true
shed-proto.workspace = true
shed-emu.workspace = true
shed-desktop.workspace = true
shed-logbook.workspace = true
shed-save.workspace = true
shed-text.workspace = true
shed-project.workspace = true
shed-ai.workspace = true
shed-markdown.workspace = true
shed-git.workspace = true
shed-review.workspace = true
shed-client.workspace = true
shed-link.workspace = true
shed-api.workspace = true
serde_json.workspace = true
base64.workspace = true
# Must match the version gpui-ce uses, for window icons.
image = { version = "0.25", default-features = false, optional = true }
gpui = { workspace = true, optional = true }
gpui_platform = { workspace = true, optional = true }
shed-tui = { workspace = true, optional = true }
anyhow.workspace = true
serde.workspace = true
toml.workspace = true
toml_edit.workspace = true
clap.workspace = true
libc.workspace = true
async-channel.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

raw-window-handle = { version = "0.6", optional = true }

# Changing an open window's icon on X11, which GPUI only sets at opening, and
# hearing which selection changed last (XFixes), for middle-click.
[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["xfixes"], optional = true }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
shed-keeper.workspace = true
tokio.workspace = true
tempfile.workspace = true
